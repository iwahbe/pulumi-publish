name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pushes to main exercise (and populate) the real pulumi-artifacts branch.
# PR runs get a disposable per-run branch instead, deleted by the cleanup
# job, so they exercise the full pipeline — including orphan-branch
# creation — without touching real artifacts. Fork PRs fail at the commit
# job (read-only token); PRs from this repo are the supported case.
jobs:
  # Stand in for a provider repo's build job: fetch a released provider binary
  # and upload it as an artifact. pulumi-hcl embeds a version and an SVG
  # logoUrl, so it exercises the schema validation and the dotnet logo
  # conversion.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download the pulumi-hcl provider
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo pulumi/pulumi-hcl \
            --pattern 'pulumi-resource-hcl-v*-linux-amd64.tar.gz' \
            --output "$RUNNER_TEMP/provider.tar.gz"
          tar -xzf "$RUNNER_TEMP/provider.tar.gz" -C "$RUNNER_TEMP" pulumi-resource-hcl
      - uses: actions/upload-artifact@v7
        with:
          name: provider
          path: ${{ runner.temp }}/pulumi-resource-hcl
          if-no-files-found: error

  publish:
    needs: build
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: write
    with:
      provider-artifact: provider
      provider-binary: pulumi-resource-hcl
      branch: ${{ github.event_name == 'pull_request' && format('test-artifacts-{0}', github.run_id) || 'pulumi-artifacts' }}

  dump:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        id: dump
        with:
          mode: dump
          branch: ${{ github.event_name == 'pull_request' && format('test-artifacts-{0}', github.run_id) || 'pulumi-artifacts' }}
          path: ${{ runner.temp }}/prebuilt
      - name: Verify the dumped tree matches what publish recorded
        env:
          GOT: ${{ steps.dump.outputs.commit }}
          WANT: ${{ needs.publish.outputs.commit }}
          PREBUILT: ${{ runner.temp }}/prebuilt
        run: |
          test -n "$WANT"
          test "$GOT" = "$WANT"
          test -f "$PREBUILT/schema.json"
          for language in go nodejs python dotnet java; do
            test -d "$PREBUILT/sdk/$language"
          done

  cleanup:
    needs: [publish, dump]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Delete the scratch branch and its notes
        env:
          BRANCH: test-artifacts-${{ github.run_id }}
        run: |
          for ref in "refs/heads/$BRANCH" "refs/notes/$BRANCH"; do
            if git ls-remote --exit-code origin "$ref" >/dev/null; then
              git push origin --delete "$ref"
            fi
          done
